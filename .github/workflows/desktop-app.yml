name: Desktop App

on:
  push:
    branches: [main, develop]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - app/**
      - fetchtv.js
      - package.json
      - package-lock.json
      - .github/workflows/desktop-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install fetchtv
        run: npm ci --no-fund --no-audit

      - name: Test fetchtv
        if: runner.os == 'Linux'
        run: npm test

      - name: Install the desktop app
        working-directory: app
        run: npm ci --no-fund --no-audit

      - name: Allow the Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test the desktop app
        if: runner.os != 'Linux'
        working-directory: app
        env:
          FETCHTV_E2E_SKIP_SSDP: ${{ runner.os == 'Windows' && '1' || '' }}
        run: npm test

      - name: Test the desktop app (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run --auto-servernum npm test

      - name: Build the desktop app
        working-directory: app
        run: npm run dist -- --${{ matrix.platform }}

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetchtv-${{ matrix.platform }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: builds
          merge-multiple: true

      - name: Attach the builds to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" builds/* --clobber
              exit 0
            fi
            echo "No release for $TAG yet. Waiting a minute (attempt $attempt of 30)."
            sleep 60
          done
          echo "No release for $TAG after 30 minutes. Create it, then re-run this job."
          exit 1
