<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fetchtv</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top" id="top">
    <span class="mark" role="img" aria-label="fetchtv"><span class="chip blue"></span><span class="chip orange"></span><span class="chip yellow"></span><span class="tray"></span></span>
    <ol class="steps" id="steps" aria-label="Steps">
      <li data-step="1"><span class="step-bar"></span><span class="step-label">Find your Fetch box</span></li>
      <li data-step="2"><span class="step-bar"></span><span class="step-label">Choose recordings</span></li>
      <li data-step="3"><span class="step-bar"></span><span class="step-label">Choose a folder</span></li>
      <li data-step="4"><span class="step-bar"></span><span class="step-label">Save</span></li>
    </ol>
  </header>
  <main id="view" tabindex="-1"></main>
  <div class="actions" id="actions"></div>
  <footer class="bottom">
    <span id="about-line">fetchtv</span>
    <span class="bottom-links">
      <button type="button" role="switch" class="toggle" id="sound-toggle" aria-checked="true"><span class="toggle-track"><span class="toggle-knob"></span></span><span>Sounds</span></button>
      <button type="button" class="link" id="project-link">Project page and help</button>
    </span>
  </footer>
  <script src="sounds.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
